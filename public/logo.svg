<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#090d16" />
  <rect x="2" y="2" width="96" height="96" rx="22" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
  <!-- Regex slash symbols & beaker lab icon -->
  <path d="M26 30 L42 70" stroke="url(#primary-grad)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
  <path d="M58 30 L74 70" stroke="url(#primary-grad)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
  <!-- Center asterisk / cursor pulse -->
  <circle cx="50" cy="50" r="6" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="50" cy="50" r="3" fill="#ffffff" />
  <path d="M50 36 L50 42 M50 58 L50 64 M36 50 L42 50 M58 50 L64 50" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
</svg>
